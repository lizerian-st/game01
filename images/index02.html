<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>信仰之絆</title>
    <style>
body { 
            margin: 0; 
            background: #0a0a0a; 
            color: #f0f0f0; 
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            /* 阻止手機瀏覽器預設的雙擊縮放與下拉重整行為 */
            touch-action: none; 
        }
        
        /* 🎮 遊戲主要容器：加入了自動等比例縮放的黑科技 */
        #game-container { 
            width: 1024px; 
            height: 576px; 
            position: relative; 
            background: #1a1a1a; 
            border: 3px solid #333; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); 
            overflow: hidden; 
            flex-shrink: 0;
            
            /* 核心：根據螢幕寬高，自動計算並縮放 1024x576 的畫面 */
            transform: scale(var(--game-scale, 1));
            transform-origin: center center;
        }
      
        /* 🎨 遊戲封面頁樣式 */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 建議生成 AI 封面圖後，將下行換成你的封面圖路徑 */
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.6)), url('images/op01.png');
            background-size: cover;
            background-position: center;
            z-index: 100; /* 確保擋在最上層 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        
        #game-title {
            font-size: 80px;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 4px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 20px rgba(92,184,255,0.6);
        }
        
        #game-subtitle {
            font-size: 30px;
            color: #f1c40f;
            margin-bottom: 40px;
            font-style: italic;
            max-width: 800px;
            text-align: center;
            line-height: 1.6;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
        }
        
        #start-btn {
            width: 200px;
            font-size: 18px;
            letter-spacing: 2px;
            padding: 15px;
        }
	  
        /* 🌅 動態背景層 */
        #game-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: background-image 0.8s ease-in-out; z-index: 1; }
        
        /* 👤 昏暗氛圍遮罩層 */
        #bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.85) 100%); pointer-events: none; z-index: 2; }
        
        /* 🎭 半身立繪容器層 */
        #chara-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 3; pointer-events: none; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 120px; box-sizing: border-box; }
        .chara-img { height: 380px; width: auto; opacity: 0; transform: translateY(20px); transition: all 0.4s ease; filter: brightness(0.6); }
        .chara-img.active { opacity: 1; transform: translateY(0) scale(1.05); filter: brightness(1); }
        .chara-img.visible { opacity: 0.5; transform: translateY(0); }

        /* 💬 文字框與對話系統 */
        #textbox { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 940px; height: 160px; background: rgba(10, 15, 25, 0.75); border: 2px solid #4a5a7a; padding: 25px; box-sizing: border-box; cursor: pointer; border-radius: 8px; z-index: 10; }
        #char-name { font-size: 22px; color: #5cb8ff; margin-bottom: 12px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        #dialogue { font-size: 18px; line-height: 1.6; color: #e0e0e0; }
        
        /* 🎛️ 選項系統 */
        #choices { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 12px; width: 750px; z-index: 20; }
        .btn { background: rgba(25, 35, 50, 0.95); color: #fff; padding: 12px 20px; border: 2px solid #5cb8ff; cursor: pointer; text-align: center; border-radius: 6px; font-size: 16px; font-weight: bold; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn:hover { background: #5cb8ff; color: #0a0a0a; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(92,184,255,0.4); }
        
        #stage-desc { position: absolute; top: 20px; left: 20px; font-size: 14px; color: #a9dfbf; font-style: italic; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <h1 id="game-title">信仰之絆</h1>
        <p id="game-subtitle">「當傳統、聖經、自由互相抵觸，你選擇哪一個？」</p>
        <div id="start-btn" class="btn">▶ 開始遊戲</div>
    </div>


    <div id="game-bg"></div>
    <div id="bg-overlay"></div>
    
    <!-- 🎭 立繪顯示區域（左耀祖，右依模） -->
    <div id="chara-layer">
        <img id="chara-yau" class="chara-img" src="images/boy.png?auto=format&fit=crop&w=300&q=80" alt="耀祖立繪佔位">
        <img id="chara-yee" class="chara-img" src="images/girl.png?auto=format&fit=crop&w=300&q=80" alt="依模立繪佔位">
    </div>

    <div id="stage-desc"></div>
    <div id="choices"></div>
    <div id="textbox" onclick="nextStep()">
        <div id="char-name"></div>
        <div id="dialogue"></div>
    </div>
</div>

<script>
let love = 0;

        playground: "images/bg5.png?auto=format&fit=crop&w=1024&q=80"// 最終操場

const story = [
    // 🌅 序章：童年的榕樹頭

{ name: "系統提示", text: "（按對話框繼續遊戲。）", stage: "角色介紹", bg: assets.bg.banyan, chara: "none" },
	{ name: "陳可賓", text: "遊戲主角，也就是玩家自己。中學時開始信耶穌，參加教會。與另外兩個角色都是青梅竹馬(1/3)。", stage: "角色介紹", bg: assets.bg.banyan, chara: "none" },
	{ name: "耀祖", text: "李耀祖，青梅竹馬(2/3)，圍村長大的男孩子，思想受傳統文化影響。", stage: "角色介紹", bg: assets.bg.banyan, chara: "yau" },
	{ name: "依模", text: "吳依模，青梅竹馬(3/3)，圍村長大的女孩子，崇尚自由思想。", stage: "角色介紹", bg: assets.bg.banyan, chara: "yee" },
    { name: "背景音", text: "（蟬鳴聲、輕鐵駛過的聲音。）", stage: "序章：童年的榕樹頭", bg: assets.bg.banyan, chara: "none" },
    //5
	{ name: "陳可賓（內心獨白）", text: "我、耀祖、依模，在屯門同一間幼稚園讀書。", bg: assets.bg.banyan, chara: "none" },
	{ name: "陳可賓（內心獨白）", text: "耀祖與依模是同一個圍村的原居民；", bg: assets.bg.banyan, chara: "none" },
	{ name: "陳可賓（內心獨白）", text: "而我是村外人，但因為我們的父母，非常熟絡，我們三個自少一同玩耍，成長。", bg: assets.bg.banyan, chara: "none" },
    { name: "陳可賓（內心獨白）", text: "耀祖最講義氣，小時候有人取笑依模，他立刻衝去跟那人打架。", bg: assets.bg.banyan, chara: "yau" },
	{ name: "陳可賓（內心獨白）", text: "有人搶我玩具，也是他幫我搶回來。", bg: assets.bg.banyan, chara: "yau" },
	//10
	{ name: "陳可賓（內心獨白）", text: "依模小時時愛哭鬼，時常躲在我們身後。但長大後變得大膽，喜歡新事物。", bg: assets.bg.banyan, chara: "yee" },
	{ name: "陳可賓（內心獨白）", text: "我以為，雖然我們性格不同，但友誼永遠繼續。直到中五那年，一切都改變了。」", bg: assets.bg.banyan, chara: "none" },
    
    // 🎬 場景一：新墟的茶餐廳
    { name: "系統提示", text: "（場景一：新墟的茶餐廳。下午四點。)", stage: "新墟茶餐廳", bg: assets.bg.cafe, chara: "none" },
	{ name: "系統提示", text: "(餐廳內杯碟聲不斷，電視正播放著外國要求同性婚姻合法化遊行的專題報導。）", stage: "新墟茶餐廳", bg: assets.bg.cafe, chara: "none" },
    { name: "耀祖", text: "「哼，不知所謂。那班人常常出來擾亂秩序，男同男、女同女成何體統？」", bg: assets.bg.cafe, chara: "yau" },
	//15
	{ name: "耀祖", text: "「上週鄰村有個女生被發現是女同性戀，她父母在村祠堂門口，被長輩鬧到抬不起頭！」", bg: assets.bg.cafe, chara: "yau" },
	{ name: "耀祖", text: "「如果讓我知道我們村裡面，有人是同性戀，我一定不會放過他！」", bg: assets.bg.cafe, chara: "yau" },
    { name: "依模", text: "「呵，不會放過他？村裡面的老一輩，只顧面子、繁衍後代、分丁權，其他什麼都不懂！」", bg: assets.bg.cafe, chara: "yee" },
	{ name: "依模", text: "「祠堂跟本就是一座監獄。喜歡誰，需要向你交代嗎？」", bg: assets.bg.cafe, chara: "yee" },

	//20
	{ name: "依模", text: "「還是，你跟李耀祖一樣，其實心底裡都覺得，好像我這種追求自由的女孩子，很有問題？」", bg: assets.bg.cafe, chara: "yee" },
    { name: "耀祖", text: "「吳依模！你說話沒大沒小！你嫌棄我們圍村傳統？你喜歡新事物，但千萬不要行差踏錯！」", bg: assets.bg.cafe, chara: "yau" },
    { name: "依模", text: "「好心？你這叫控制慾！可賓，如果你不站我這邊，證明你跟他一樣，信了教就只有規矩。」", bg: assets.bg.cafe, chara: "yee" },
	{ name: "依模", text: "「一點人性也沒有了，朋友也不幫！是不是連你都覺得我很麻煩？」", bg: assets.bg.cafe, chara: "yee" },
    { name: "陳可賓（內心獨白）", text: "耀祖滿臉通紅，拳頭緊握；依模眼光挑釁，逼著我立刻表態。我該怎麼開口？", bg: assets.bg.cafe, chara: "both",

	//25  
	{ name: "陳可賓", text: "「聖經中神創造世界，設立的就是一男一女的婚姻。傳統同聖經都有它的本意。」", bg: assets.bg.cafe, chara: "both", next: 28 },
    { name: "陳可賓", text: "「依模說得對啊，喜歡誰沒毛病？你不要用村那一套逼人。我支持每個人都有愛人的自由，嗯...可能...不一定一男一女...我支持你。」", bg: assets.bg.cafe, chara: "both", next: 28},
    { name: "陳可賓", text: "「好啦，兩位大爺！明天要交功課啊。一會兒一起乘輕鐵回家吧。」", bg: assets.bg.cafe, chara: "both", next: 28  },
	// 🎬 場景二：秘密的敗露（後樓梯危機）
    { name: "系統提示", text: "（場景二：耀祖拉著可賓，在學校後樓梯偷看。)", stage: "學校後樓梯", bg: assets.bg.stairs, chara: "none" },
	{ name: "系統提示", text: "(依模正和一個打扮中性的高年級女生激烈爭吵，那女生拉著依模的手，依模哭著甩開，最後那女生吻了依模的臉頰後離去。依模靠在牆上喘氣。)", stage: "學校後樓梯", bg: assets.bg.stairs, chara: "none" },
    //30
	{ name: "耀祖", text: "「可賓你看！依模居然……是女同？！枉虧我平時當她妹妹般愛護，竟然瞞住我們做這些事情！簡直不知羞恥！」", bg: assets.bg.stairs, chara: "yau" },
    { name: "系統提示", text: "（耀祖憤怒地打了一下牆壁，發出巨大的撞擊聲。依模嚇了一跳，臉色一瞬間變得慘白。）", stage: "學校後樓梯", bg: assets.bg.stairs, chara: "both" },
    { name: "依模", text: "「（面色慘白）「啊！你們都看到啦？你們是否覺得我好噁心？李耀祖，你是否想拉我去祠堂，打斷我雙腳啊？」", bg: assets.bg.stairs, chara: "yee" },
	{ name: "依模", text: "「我由中一開始就喜歡女仔！平時跟你們食飯，你們開口埋口說生仔、說傳統，我都覺得好反胃啊！」", bg: assets.bg.stairs, chara: "yee" },
    { name: "耀祖", text: "「你…，我當你是親妹妹才那麼緊張！你做這些事，如果被同級那班人知道，班男仔會取笑你！女仔會排擠你！可賓，你也責罵一下！」", bg: assets.bg.stairs, chara: "yau" },
    //35

	{ name: "陳可賓", text: "「依模，你冷靜一點。耀祖是因為把你當成親人、害怕你在學校和村子裡被排擠才會這麼激動。依模，你可以跟我們再解釋清楚嗎？」", bg: assets.bg.stairs, chara: "both", next: 39 },
    { name: "陳可賓", text: "「依模，你怎麼可以這樣跟耀祖說話？他雖然大聲，但出發點是關心你未來的處境。你瞞了我們這麼多年，竟然還要用這種態度跟我們說話，你太讓我失望了。」", bg: assets.bg.stairs, chara: "both", next: 39},
    { name: "陳可賓", text: "「你們……你們不要再吵了。依模，你先回家冷靜一下。耀祖，我們也走吧，一會兒工友就要來鎖門了。感情的事情我真的不懂啊。」", bg: assets.bg.stairs, chara: "both", next: 39 },
    // 🎬 新場景三：十字路口的抉擇（大分歧點）

    //40
	{ name: "陳可賓（內心獨白）", text: "這十多年的感情在這一分鐘彷彿就要碎成碎片。身為他們最好的朋友，我此時……到底應該往哪邊走？", bg: assets.bg.stairs, chara: "none",

 	//45
	{ name: "系統提示", text: "(耀祖背對著可賓，死死捏著欄杆，手指關節發白，肩膀劇烈顫抖。）", stage: "分支：天台", bg: assets.bg.rooftop, chara: "yau" },

function nextStep() {
    if (story[step].choices || story[step].check) return;
    if (step < story.length - 1) {
        step++;
        update();
    }
}

// 🎭 控制立繪顯示與亮度的核心邏輯
function setCharaDisplay(charaState) {
    const yauImg = document.getElementById("chara-yau");
    const yeeImg = document.getElementById("chara-yee");
    
    // 先移除所有狀態標籤
    yauImg.className = "chara-img";
    yeeImg.className = "chara-img";
    
    if (charaState === "yau") {
        yauImg.classList.add("active");
        yeeImg.classList.add("visible"); // 依模在場但處於暗色
    } else if (charaState === "yee") {
        yeeImg.classList.add("active");
        yauImg.classList.add("visible"); // 耀祖在場但處於暗色
    } else if (charaState === "both") {
        yauImg.classList.add("visible");
        yeeImg.classList.add("visible");
    }
    // "none" 則維持兩者完全隱藏 (opacity: 0)
}

function update() {
    const node = story[step];
    
    // 🖼️ 變更背景圖
    if (node.bg) {
        document.getElementById("game-bg").style.backgroundImage = `url('${node.bg}')`;
    }
    
    // 🎭 更新角色立繪
    if (node.chara) {
        setCharaDisplay(node.chara);
    }
    
    if (node.stage) {
        document.getElementById("stage-desc").innerText = node.stage;
    }
    
    document.getElementById("char-name").innerText = node.name;
    document.getElementById("dialogue").innerText = node.text;
    document.getElementById("choices").innerHTML = "";

		document.getElementById("choices").style.display = "flex";

            let b = document.createElement("div");

            c3.className = "btn"; c3.innerText = "「耀祖！你明明是因為太害怕依模被村裡的人指指點點，為什麼不敢承認你是在用生命護著她？！依模！聖經的標準很高，但我信的神從來沒當你是垃圾，祂愛你，我也絕對不會拋棄你！十年的感情，連一個真正坐低傾的機會都無嗎？！」";
            c3.onclick = () => { triggerEscapedBadEnd(); };

            document.getElementById("choices").appendChild(c1);
            document.getElementById("choices").appendChild(c2);
            document.getElementById("choices").appendChild(c3);
        } else {
            let c1 = document.createElement("div");
            c1.className = "btn"; c1.innerText = "「依模，對唔住。雖然這很殘忍，但我認同耀祖。聖經的最高心意確實是一男一女的婚姻，同性戀是罪。耀祖承受了這麼多家族壓力，他是為了保護你。如果你堅持不願意改變這種生活方式，我們……沒辦法回到過去了。」";
            c1.onclick = () => { showEndingA(); };
            
            let c2 = document.createElement("div");
            c2.className = "btn"; c2.innerText = "「耀祖，你太過分了。如果你傳統是要依模的整個人、逼她痛苦一輩子，我寧願不要這種傳統！依模，你沒有錯，做你自己！」";
            c2.onclick = () => { showEndingB(); };

            let c3 = document.createElement("div");
            c3.className = "btn"; c3.innerText = "「耀祖！你明明是因為太害怕依模被村裡的人指指點點，為什麼不敢承認你是在用生命護著她？！依模！聖經的標準很高，但我信的神從來沒當你是垃圾，祂愛你，我也絕對不會拋棄你！十年的感情，連一個真正坐低傾的機會都無嗎？！」";
            c3.onclick = () => { checkValuesForEndingCOrTrue(); };

            document.getElementById("choices").appendChild(c1);
            document.getElementById("choices").appendChild(c2);
            document.getElementById("choices").appendChild(c3);
        }
    }
}


// 核心：修改後的 showEndingA 依然極簡
function showEndingA() {
    playEndingSequence(endingScripts.B);
	document.getElementById("stage-desc").innerText = "結局 B：律法審判後的孤寂";
}

function showEndingB() {
    playEndingSequence(endingScripts.C);
	document.getElementById("stage-desc").innerText = "結局C：失去靈魂的自由";
}

function showEndingC() {
    playEndingSequence(endingScripts.D);
	document.getElementById("stage-desc").innerText = "結局D：虛偽橋樑的崩塌";	
}

function triggerEscapedBadEnd(){
	playEndingSequence(endingScripts.A);
	document.getElementById("stage-desc").innerText = "結局A：虛偽與逃避的代價";	
}

function showTrueEnding(){
	playEndingSequence(endingScripts.E);
    document.getElementById("stage-desc").innerText = "結局E(True Ending)：立場與愛心";
}

// 統一的結局播放器（整合重啟按鈕版）
function playEndingSequence(scriptArray) {
    let currentIndex = 0;
    
    // 隱藏原本的遊戲選項框
    document.getElementById("choices").style.display = "none"; 
	
    // 渲染每一幕的函式
    function renderStep() {
        const currentScene = scriptArray[currentIndex];
        document.getElementById("char-name").innerText = currentScene.name;
        document.getElementById("dialogue").innerText = currentScene.text;
        document.getElementById("game-bg").style.backgroundImage = currentScene.bg;
    
    
	if (currentScene.chara) {
            setCharaDisplay(currentScene.chara);
        } else {
            // 如果忘記寫，預設讓兩人都維持 visible 狀態作為安全防線
            setCharaDisplay("both");
        }
	}
    // 初始化第一幕
    renderStep();
    
    // 綁定對話框點擊事件
    const textbox = document.getElementById("textbox");
    textbox.onclick = function() {
        currentIndex++;
        
        if (currentIndex < scriptArray.length) {
            // 還有下一幕，繼續播放故事
            renderStep();
        } else {
            // 📖 故事播完了！
            
            // 1. 鎖死對話框點擊，防止玩家重複點擊
            textbox.onclick = null;
            textbox.style.cursor = "default";
            
            // 2. 調用重啟按鈕函式
            showRestartButton();
        }
    };
}

// 🔄 顯示重頭遊玩按鈕的函式
function showRestartButton() {
    const choicesContainer = document.getElementById("choices");
    
    // 清空原本的選項內容（防止殘留舊選項）
    choicesContainer.innerHTML = "";
    
    // 創建一個新的「重新開始」按鈕
    const restartBtn = document.createElement("div");
    restartBtn.className = "btn";
    restartBtn.innerText = "返回起初，重頭遊玩";
    
    // 點擊按鈕時觸發遊戲重置
    restartBtn.onclick = function() {
		love = 0; truth = 0; escaped = false; step = 0; 
        restartGame();
    };
    
    // 將按鈕塞入選項容器並顯示出來
    choicesContainer.appendChild(restartBtn);
    choicesContainer.style.display = "flex";
}

function checkValuesForEndingCOrTrue() {
    if (love >= 4 && truth >= 4) {
        love += 2; truth += 1;
        showTrueEnding();
    } else {
        showEndingC();
    }
}


function startGameProcess() {
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("textbox").style.display = "block";
    update(); 
}

function restartGame() {
    const textbox = document.getElementById("textbox");
	textbox.onclick = nextStep;
    textbox.style.cursor = "pointer";
    textbox.style.display = "none"; 
    
    document.getElementById("choices").style.display = "none";
    document.getElementById("chara-yau").className = "chara-img";
    document.getElementById("chara-yee").className = "chara-img";
    document.getElementById("stage-desc").innerText = "";
    
    const startScreen = document.getElementById("start-screen");
    startScreen.style.display = "flex";
    startScreen.style.opacity = "1";
}




	
	
// 📱 自動等比例縮放黑科技
function resizeGame() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    const scaleX = windowWidth / 1024;
    const scaleY = windowHeight / 576;
    const scale = Math.min(scaleX, scaleY, 1); 
    document.documentElement.style.setProperty('--game-scale', scale);
}

// ⏳ 綁定初始化與封面監聽
window.addEventListener('DOMContentLoaded', () => {
    resizeGame(); 
    document.getElementById("start-btn").onclick = startGameProcess;
});

window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', resizeGame);
</script>
